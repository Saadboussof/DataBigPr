services:

  # ── 1. Apache Kafka (KRaft mode — no Zookeeper) ──────────────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: taasim-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners: INTERNAL for Docker containers, EXTERNAL for Windows host
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: LelM2dIFQkiUFvXCEcqRWA
      KAFKA_LOG_RETENTION_HOURS: 168          # 7 days retention
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false" # We create topics explicitly
    volumes:
      - kafka_data:/var/lib/kafka/data

  # ── 1b. Kafka topic initializer (runs once then exits) ────────────────
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: taasim-kafka-init
    depends_on:
      - kafka
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for Kafka to be ready...';
      sleep 15;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic raw.gps          --partitions 4 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic raw.trips        --partitions 4 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic processed.gps    --partitions 4 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic processed.demand --partitions 4 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic processed.matches --partitions 4 --replication-factor 1;
      echo '✅ All 5 Kafka topics created successfully.';
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list;
      "

  # ── 2. MinIO (S3-compatible Object Storage) ───────────────────────────
  minio:
    image: minio/minio:latest
    container_name: taasim-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    volumes:
      - minio_data:/data

  # ── 2b. MinIO bucket initializer (runs once then exits) ───────────────
  minio-init:
    image: minio/mc:latest
    container_name: taasim-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 admin password;
      mc mb --ignore-existing local/raw;
      mc mb --ignore-existing local/curated;
      mc mb --ignore-existing local/ml-store;
      mc mb --ignore-existing local/kafka-archive;
      exit 0;
      "

  # ── 3. Apache Cassandra ───────────────────────────────────────────────
  cassandra:
    image: cassandra:4.1
    container_name: taasim-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: TaaSimCluster
    volumes:
      - cassandra_data:/var/lib/cassandra

  # ── 3b. Cassandra schema initializer (runs once then exits) ───────────
  cassandra-init:
    image: cassandra:4.1
    container_name: taasim-cassandra-init
    depends_on:
      - cassandra
    volumes:
      - ./src/cassandra_schema.cql:/schema.cql
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for Cassandra to be ready...';
      sleep 40;
      cqlsh cassandra 9042 -f /schema.cql;
      echo '✅ Cassandra schema applied!';
      cqlsh cassandra 9042 -e 'DESCRIBE KEYSPACE taasim;';
      "

  # ── 4. Apache Flink ───────────────────────────────────────────────────
  flink-jobmanager:
    build: ./src/flink
    container_name: taasim-flink-jm
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
    volumes:
      - ./src/flink:/opt/flink/usrlib

  flink-taskmanager:
    build: ./src/flink
    container_name: taasim-flink-tm
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
    volumes:
      - ./src/flink:/opt/flink/usrlib

  # ── 5. Apache Spark ───────────────────────────────────────────────────
  spark-master:
    image: apache/spark:3.5.3-python3
    container_name: taasim-spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      SPARK_MASTER_HOST: spark-master

  spark-worker:
    image: apache/spark:3.5.3-python3
    container_name: taasim-spark-worker
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2G

  # ── 6. Jupyter Lab (PySpark) ──────────────────────────────────────────
  jupyter:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: taasim-jupyter
    ports:
      - "8888:8888"
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      JUPYTER_TOKEN: "taasim"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./data:/home/jovyan/data
      - ./src:/home/jovyan/src
    depends_on:
      - spark-master

  # ── 7. Kafka-to-MinIO Archiver ────────────────────────────────────────
  # Lightweight Python consumer that mirrors raw.gps and raw.trips
  # to MinIO kafka-archive/ bucket (replaces heavy Confluent Connect)
  kafka-archiver:
    build:
      context: ./src/archiver
      dockerfile: Dockerfile
    container_name: taasim-kafka-archiver
    depends_on:
      - kafka
      - minio
    environment:
      KAFKA_BROKER: kafka:29092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password
      MINIO_BUCKET: kafka-archive
      TOPICS: "raw.gps,raw.trips"
    restart: unless-stopped

  # ── 8. Grafana ────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: taasim-grafana
    ports:
      - "3000:3000"
    environment:
      GF_INSTALL_PLUGINS: hadesarchitect-cassandra-datasource
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - cassandra

volumes:
  kafka_data:
  minio_data:
  cassandra_data:
